media:
  input: media
  output: /media

content:
  # HOMEPAGE
  - name: homepage
    label: Homepage HTML
    type: file
    path: index.html
    format: code
    options:
      language: html

  # ABOUT PAGE
  - name: about
    label: About Page HTML
    type: file
    path: about.html
    format: code
    options:
      language: html

  # COURSES PAGE
  - name: courses
    label: Courses Page HTML
    type: file
    path: courses.html
    format: code
    options:
      language: html

  # BLOG LISTING PAGE
  - name: blog_page
    label: Blog Listing HTML
    type: file
    path: blog.html
    format: code
    options:
      language: html

  # FREE RESOURCES PAGE
  - name: resources
    label: Resources Page HTML
    type: file
    path: resources.html
    format: code
    options:
      language: html

  # CONTACT PAGE
  - name: contact
    label: Contact Page HTML
    type: file
    path: contact.html
    format: code
    options:
      language: html

  # BLOG POSTS
  - name: blog
    label: Blog Posts
    type: collection
    path: blog-posts
    filename: "{primary}.md"
    format: yaml-frontmatter

    view:
      fields:
        - title
        - date
        - seo_title
      primary: title
      sort:
        - date
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Blog Title
        type: string
        required: true

      - name: slug
        label: URL Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: Use lowercase words separated by hyphens.

      - name: description
        label: Short Description
        type: text
        required: true

      - name: seo_title
        label: SEO Title
        type: string
        required: true

      - name: seo_description
        label: SEO Meta Description
        type: text
        required: true

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: author
        label: Author
        type: string

      - name: category
        label: Category
        type: string

      - name: image
        label: Featured Image
        type: image

      - name: image_alt
        label: Image Alt Text
        type: string

      - name: tags
        label: Tags
        type: string
        list: true

      - name: published
        label: Publish Article
        type: boolean

      - name: body
        label: Article Content
        type: rich-text
        required: true