media:
  input: media
  output: /media

content:
  - name: blog
    label: Blog Posts
    type: collection
    path: blog-posts
    filename: "{primary}.md"
    format: yaml-frontmatter

    view:
      fields:
        - title
        - date
        - seo_title
      primary: title
      sort:
        - date
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Blog Title
        type: string
        required: true

      - name: slug
        label: URL Slug
        type: string
        required: true
        description: Use lowercase words separated by hyphens.

      - name: description
        label: Short Description
        type: text
        required: true
        description: A short summary displayed with your blog post.

      - name: seo_title
        label: SEO Title
        type: string
        required: true
        description: The title you want search engines to display.

      - name: seo_description
        label: SEO Meta Description
        type: text
        required: true
        description: Write a unique description for search engine results.

      - name: date
        label: Publication Date
        type: date
        required: true

      - name: author
        label: Author
        type: string
        default: ContentCraft Academy

      - name: category
        label: Category
        type: string

      - name: image
        label: Featured Image
        type: image

      - name: image_alt
        label: Image Alt Text
        type: string

      - name: tags
        label: Tags
        type: string
        list: true

      - name: published
        label: Publish Article
        type: boolean

      - name: body
        label: Article Content
        type: rich-text
        required: true